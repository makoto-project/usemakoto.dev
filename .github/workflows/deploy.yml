name: Validate and deploy GitHub Pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          path: site
          persist-credentials: false

      - name: Select the exact core pin
        id: pin
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f schema/core-release.json && ! -f schema/core-candidate.json ]]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "commit=$(jq -r .commit schema/core-release.json)" >> "$GITHUB_OUTPUT"
          elif [[ -f schema/core-candidate.json && ! -f schema/core-release.json ]]; then
            echo "mode=candidate" >> "$GITHUB_OUTPUT"
            echo "commit=$(jq -r .commit schema/core-candidate.json)" >> "$GITHUB_OUTPUT"
          else
            echo "exactly one core candidate or release pin is required" >&2
            exit 1
          fi

      - name: Check out pinned Makoto core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          repository: makoto-project/makoto
          ref: ${{ steps.pin.outputs.commit }}
          path: core
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1, Node 24
        with:
          enable-cache: true

      - name: Run the candidate or release gate
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.pin.outputs.mode }}" == "candidate" ]]; then
            ./scripts/check.sh --candidate --core-repo ../core
          else
            ./scripts/check.sh --release --core-repo ../core
          fi

  deploy-and-probe:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Deploy the validated candidate or release tree
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0, Node 24
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1, Node 24
      - name: Verify the hosted candidate or release contract
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f schema/core-candidate.json ]]; then
            uv run scripts/probe_hosted.py --candidate --attempts 72 --retry-delay 10 --timeout 15
          else
            uv run scripts/probe_hosted.py --release --attempts 72 --retry-delay 10 --timeout 15
          fi

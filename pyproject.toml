[project]
name = "makoto-site-tools"
version = "0.2.0a0"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.25,<5",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
